services:
  assistant:
    build: .
    ports:
      - "8100:8100"
    env_file: .env
    environment:
      # Dentro de la red de Compose cada servicio se resuelve por su nombre.
      WEATHER_API_BASE_URL: http://weather-api:8000
      DATABASE_URL: postgresql+asyncpg://assistant:assistant@postgres:5432/assistant
      REDIS_URL: redis://redis:6379/1
      TZ: America/Argentina/Buenos_Aires
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8100
    depends_on:
      weather-api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  weather-api:
    build:
      context: ../weather-api
    env_file:
      - ../weather-api/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
