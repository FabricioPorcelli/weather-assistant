services:
  assistant:
    build: .
    ports:
      - "8100:8100"
    env_file: .env
    environment:
      # Dentro de la red de Compose cada servicio se resuelve por su nombre.
      WEATHER_API_BASE_URL: http://weather-api:8000
    depends_on:
      - weather-api

  weather-api:
    build:
      context: ../weather-api
    env_file:
      - ../weather-api/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
