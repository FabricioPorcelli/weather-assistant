services:
  assistant:
    build: .
    expose:
      - "8100"
    environment:
      WEATHER_API_BASE_URL: ${WEATHER_API_BASE_URL}
      WEATHER_API_TIMEOUT_SECONDS: ${WEATHER_API_TIMEOUT_SECONDS:-10}
      WEATHER_API_RETRIES: ${WEATHER_API_RETRIES:-1}
      WEATHER_API_RETRY_DELAY_SECONDS: ${WEATHER_API_RETRY_DELAY_SECONDS:-0.5}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ASSISTANT_CORS_ORIGINS: ${ASSISTANT_CORS_ORIGINS:-}
      RATE_LIMIT: ${RATE_LIMIT:-20/minute}
      MAX_MESSAGE_CHARS: ${MAX_MESSAGE_CHARS:-500}
      HISTORY_TURNS: ${HISTORY_TURNS:-6}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      MAX_TOOL_CALLS_PER_TURN: ${MAX_TOOL_CALLS_PER_TURN:-4}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      PORT: ${PORT:-8100}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/v1/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
