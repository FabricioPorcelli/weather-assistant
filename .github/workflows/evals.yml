name: Evals

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modelo compatible con OpenAI"
        required: true
        default: "openai/gpt-oss-120b"
      limit:
        description: "Cantidad máxima de casos (0 = todos)"
        required: true
        default: "0"
      delay_seconds:
        description: "Espera entre llamadas al LLM"
        required: true
        default: "4"

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Ejecutar evals
        env:
          LLM_BASE_URL: https://api.groq.com/openai/v1
          LLM_MODEL: ${{ inputs.model }}
          LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: >
          python evals/run_evals.py
          --models "${{ inputs.model }}"
          --limit "${{ inputs.limit }}"
          --delay-seconds "${{ inputs.delay_seconds }}"

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/reports/
